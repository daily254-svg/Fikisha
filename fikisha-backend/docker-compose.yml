services:
  postgres:
    image: postgres:17
    container_name: fikisha-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fikisha
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: fikisha-redis
    restart: always
    ports:
      - "6379:6379"